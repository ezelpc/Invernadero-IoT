name: CI/CD Pipeline - Invernadero IoT

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: invernadero-iot

permissions:
  contents: read

jobs:
  build-firmware:
    name: Build ESP32 Firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check platformio
      - name: Build firmware
        working-directory: hardware/esp32
        run: pio run
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: esp32-firmware
          path: hardware/esp32/.pio/build/esp32dev/firmware.bin
          retention-days: 30

  validate:
    name: Validate Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Lambda functions
        shell: bash
        run: |
          set -euo pipefail
          for dir in cloud/lambda/process_sensor_data cloud/lambda/control_actuators; do
            cd "$GITHUB_WORKSPACE/$dir"
            if [ -f package-lock.json ]; then
              npm ci --ignore-scripts
            elif [ -f package.json ]; then
              npm install --ignore-scripts
            fi
            node --check index.js
          done
      - name: Validate CloudFormation
        run: |
          python -m pip install --disable-pip-version-check cfn-lint
          cfn-lint cloud/cloudformation/infrastructure.yml

  deploy-lambda:
    name: Deploy Lambda Functions
    runs-on: ubuntu-latest
    needs: [validate, build-firmware]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: invernadero-${{ github.run_id }}
      - name: Deploy Process Sensor Data Lambda
        working-directory: cloud/lambda/process_sensor_data
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts
          zip -qr function.zip . -x 'function.zip'
          aws lambda update-function-code \
            --function-name "${PROJECT_NAME}-process-sensor-data-prod" \
            --zip-file fileb://function.zip \
            --region "$AWS_REGION"
      - name: Deploy Control Actuators Lambda
        working-directory: cloud/lambda/control_actuators
        run: |
          set -euo pipefail
          npm ci --omit=dev --ignore-scripts
          zip -qr function.zip . -x 'function.zip'
          aws lambda update-function-code \
            --function-name "${PROJECT_NAME}-control-actuators-prod" \
            --zip-file fileb://function.zip \
            --region "$AWS_REGION"

  deploy-infrastructure:
    name: Deploy CloudFormation Stack
    runs-on: ubuntu-latest
    needs: [validate]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: invernadero-cfn-${{ github.run_id }}
      - name: Validate CloudFormation template
        run: aws cloudformation validate-template --template-body file://cloud/cloudformation/infrastructure.yml
      - name: Deploy CloudFormation stack
        run: |
          set -euo pipefail
          aws cloudformation deploy \
            --template-file cloud/cloudformation/infrastructure.yml \
            --stack-name "${PROJECT_NAME}-stack-prod" \
            --parameter-overrides ProjectName="$PROJECT_NAME" Environment=prod \
            --capabilities CAPABILITY_NAMED_IAM \
            --region "$AWS_REGION"
      - name: Get stack outputs
        run: |
          aws cloudformation describe-stacks \
            --stack-name "${PROJECT_NAME}-stack-prod" \
            --region "$AWS_REGION" \
            --query 'Stacks[0].Outputs' \
            --output table

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-firmware, deploy-lambda, deploy-infrastructure]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download firmware artifact
        uses: actions/download-artifact@v4
        with:
          name: esp32-firmware
          path: ./artifacts
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/firmware.bin
          generate_release_notes: true
